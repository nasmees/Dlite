; OPcache — recommended for production (PHP-FPM / LiteSpeed / CGI)
; On Apache mod_php this file is ignored; enable opcache in php.ini instead.
opcache.enable=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.revalidate_freq=2
opcache.fast_shutdown=1

; Allow large phone-camera uploads (app compresses them after upload)
upload_max_filesize=10M
post_max_size=12M
memory_limit=256M
